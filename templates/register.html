{% extends "base.html" %}
{% block title %}Register | InsureCare{% endblock %}
{% block content %}
<section class="form-card">
  <span class="eyebrow">GET STARTED</span><h1>Create customer account</h1>
  <p>Your unique customer ID will be generated after registration.</p>
  <form method="post">
    <label for="full_name">Full name</label><input id="full_name" name="full_name" autocomplete="name" maxlength="120" required>
    <label for="username">Username</label><input id="username" name="username" autocomplete="username" minlength="3" maxlength="80" required>
    <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" maxlength="160" required>
    <label for="phone">Phone number</label><input id="phone" name="phone" type="tel" autocomplete="tel" maxlength="30" required>
    <label for="password">Password (at least 12 characters)</label><input id="password" name="password" type="password" minlength="12" autocomplete="new-password" required>
    <label for="confirm_password">Confirm password</label><input id="confirm_password" name="confirm_password" type="password" minlength="12" autocomplete="new-password" required>
    <button class="button full" type="submit">Create account</button>
  </form>
  <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
